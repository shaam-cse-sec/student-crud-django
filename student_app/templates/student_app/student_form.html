<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    <h2>{% if student %}Edit Student{% else %}Add Student{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Name:</label><br>
        <input type="text" name="name" value="{{ student.name|default:'' }}" required><br><br>
        
        <label>Email:</label><br>
        <input type="email" name="email" value="{{ student.email|default:'' }}" required><br><br>
        
        <label>Age:</label><br>
        <input type="number" name="age" value="{{ student.age|default:'' }}" required><br><br>
        
        <label>Course:</label><br>
        <input type="text" name="course" value="{{ student.course|default:'' }}" required><br><br>
        
        <button type="submit">Save</button>
        <a href="{% url 'student_list' %}">Cancel</a>
    </form>
</body>
</html>
